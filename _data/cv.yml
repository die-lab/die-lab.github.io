cv:
  name: Diego Carli
  label: Research fellow in evolutionary genomics
  location: Piacenza, Italy
  image: ""
  summary: I study how the nuclear and mitochondrial genomes interact, focusing on small RNAs of mitochondrial origin (smithRNAs), and develop bioinformatic pipelines for small RNA-seq.

  social_networks:
